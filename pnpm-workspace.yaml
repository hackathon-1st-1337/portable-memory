allowBuilds:
  # postinstall only prints a funding banner
  core-js: false
  # postinstall ensures the native resolver binary for this platform is present (used by ESLint)
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.126'
  - '@ai-sdk/provider-utils@5.0.68'
  - '@ai-sdk/provider@4.0.34'
  - ai@7.0.153
